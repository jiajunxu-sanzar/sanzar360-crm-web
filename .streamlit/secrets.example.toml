SMTP_USE_TLS = "true"

# --- SMTP por usuario (opcional). Si existe [smtp_profiles], se enruta así:
# 1) smtp_route_by_employee: employee_id de «Usuarios CRM» -> clave de perfil
# 2) si no hay match, smtp_route_by_nombre: nombre exacto en usuarios -> perfil
# 3) si no hay match, se usan SMTP_HOST / SMTP_USER / … de arriba
#
# [smtp_profiles.jiajun]
# host = "smtp.gmail.com"
# port = "587"
# user = "tu_correo@gmail.com"
# password = "contraseña-de-aplicacion"
# use_tls = "true"
#
# [smtp_profiles.kabir]
# host = "smtp.gmail.com"
# ...
#
# [smtp_route_by_employee]
# EMP001 = "jiajun"
# EMP002 = "kabir"
#
# [smtp_route_by_nombre]
# "Jiajun Xu" = "jiajun"
# "Kabir Caravotta" = "kabir"

