# Copia este archivo a .streamlit/secrets.toml (local) o pega el contenido en
# Streamlit Community Cloud → App → Settings → Secrets.
#
# ── SMTP por usuario (IMPORTANTE: formato TOML, NO el de .env) ───────────────
# Dentro de [smtp_profiles.NOMBRE] las claves son SIEMPRE:
#   host, port, user, password, use_tls
# NO pongas SMTP_PROFILE_KABIR_HOST ni parecido (eso es solo para .env).
#
# Las rutas van en [smtp_route_by_employee] con el mismo employee_id que la
# hoja «Usuarios CRM» (ej. EMP007), sin prefijo SMTP_ROUTE_BY_EMPLOYEE_.
# ───────────────────────────────────────────────────────────────────────────

GOOGLE_SHEET_ID = ""
GOOGLE_WORKSHEET_NAME = "Contacts"

# Fallback SMTP (usuarios sin perfil o rol distinto de «sales»; opcional si todo el mundo va por perfil).
SMTP_HOST = ""
SMTP_PORT = "587"
SMTP_USER = ""
SMTP_PASSWORD = ""
SMTP_USE_TLS = "true"

# Perfiles: un bloque por persona (jiajun / kabir / …). Nombre del bloque = slug que usarás en las rutas.
[smtp_profiles.jiajun]
host = "smtp.gmail.com"
port = "587"
user = "jiajun@sanzar-group.com"
password = "xxxx xxxx xxxx xxxx"
use_tls = "true"

[smtp_profiles.kabir]
host = "smtp.gmail.com"
port = "587"
user = "kabir@sanzar-group.com"
password = "xxxx xxxx xxxx xxxx"
use_tls = "true"

# Quién usa qué perfil: clave = employee_id exacto de «Usuarios CRM», valor = slug del bloque [smtp_profiles.*]
[smtp_route_by_employee]
EMP001 = "jiajun"
EMP007 = "kabir"

# Opcional: si no tienes employee_id aún, puedes enlazar por nombre exacto (columna nombre).
# [smtp_route_by_nombre]
# "Jiajun Xu" = "jiajun"
# "Kabir Caravotta" = "kabir"

[gcp_service_account]
type = "service_account"
project_id = ""
private_key_id = ""
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = ""
client_id = ""
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = ""
